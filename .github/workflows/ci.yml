# Core checks on Linux runners only (free minutes). The macOS app is built and tested locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache sample raws
        uses: actions/cache@v4
        with:
          path: fixtures/raw
          key: samples-${{ hashFiles('fixtures/samples.json') }}

      - name: Fetch CC0 samples
        run: scripts/fetch-samples.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --release

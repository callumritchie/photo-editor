[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/callumritchie/photo-editor"
publish = false

[workspace.dependencies]
pe-catalog = { path = "crates/catalog" }
pe-raw = { path = "crates/raw" }
pe-pipeline = { path = "crates/pipeline" }
pe-colour = { path = "crates/colour" }
pe-preview = { path = "crates/preview" }
pe-export = { path = "crates/export" }
rawler = "0.8"
tiff = "0.11"
rayon = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3   # keep dependencies (decoders) fast in debug builds

[profile.release]
debug = 1
